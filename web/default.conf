server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Set variables with default values
    set $catalogue_host "catalogue";
    set $user_host "user";
    set $cart_host "cart";
    set $shipping_host "shipping";
    set $payment_host "payment";
    set $ratings_host "ratings";

    location / {
        index index.html index.htm;
        ssi on;
    }

    location /images/ {
        expires 5s;
        try_files $uri /images/placeholder.png;
    }

    location /api/catalogue/ {
        proxy_pass http://${catalogue_host}:8080/;
    }

    # location /api/user/ {
    #     proxy_pass http://${user_host}:8080/;
    # }

    # location /api/cart/ {
    #     proxy_pass http://${cart_host}:8080/;
    # }

    # location /api/shipping/ {
    #     proxy_pass http://${shipping_host}:8080/;
    # }

    # location /api/payment/ {
    #     proxy_pass http://${payment_host}:8080/;
    # }

    # location /api/ratings/ {
    #     proxy_pass http://${ratings_host}:80/;
    # }

    location /nginx_status {
        stub_status on;
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}